# Local development database. Start it with `pnpm db:up`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siyasat
      POSTGRES_PASSWORD: siyasat
      POSTGRES_DB: siyasat
    ports:
      - '5433:5432'
    volumes:
      - siyasat-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siyasat']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  siyasat-db:

}

.rd-wrap{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}.rd-jump{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:80vh;overflow:auto}.rd-jump ol{margin:6px 0 0;padding-left:18px}.rd-jump li{margin:4px 0}.rd-jump a{color:var(--maroon)}.rd-jump a.key-r,.rd-jump a.key-d{font-weight:700;background:var(--gold-soft);padding:1px 4px;border-radius:4px}

.rd-open{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--maroon);color:#fff!important;font-weight:700;text-decoration:none}.rd-open:hover{background:var(--maroon-dark)}.rd-none{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}.rd-prev iframe{width:100%;height:75vh;border:1px solid var(--line);border-radius:10px;background:#fff}.rd-prev summary{cursor:pointer;font-weight:600;color:var(--maroon);margin:10px 0}.rd-load{padding:24px 0}

.d-note-box{margin:12px 0}.d-note-box textarea{min-height:60px;font:15px/1.5 inherit;font-family:inherit}

.editbtn{white-space:nowrap}.d-edit{margin:12px 0;border:1.5px solid var(--gold);border-radius:10px;padding:8px 12px;background:var(--gold-soft)}.d-edit summary{cursor:pointer;font-weight:700;color:var(--maroon);min-height:32px;display:flex;align-items:center}.d-edit textarea{min-height:90px;font-family:inherit;font-size:15px;margin-top:6px}
.pdfup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 2px}.filechip-ok{background:#fff;border:1.5px solid var(--gold);color:var(--ok);font-weight:700;border-radius:999px;padding:3px 10px}

.updrop h2{margin:4px 0 6px;color:var(--maroon);font-size:1.4rem}.updrop p{margin:4px 0}.up-ico{font-size:34px}.updrop-card.compact .updrop{padding:18px 16px}.updrop-card.compact .up-ico{font-size:26px}.or{text-align:center;color:var(--ink-soft);margin:6px 0 14px}
.up-steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0;margin:0 0 16px}.up-steps li{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-soft);padding:10px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}.up-steps li span{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);flex:none}
.up-steps li.on{color:var(--maroon);border-color:var(--gold);background:var(--gold-soft)}.up-steps li.on span{border-color:var(--maroon)}.up-steps li.done{color:var(--ok)}.up-steps li.done span{background:var(--ok);color:#fff;border-color:var(--ok)}

@media (max-width:860px){.up-steps{grid-template-columns:1fr 1fr}}

<script>
const $=id=>document.getElementById(id), M=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='siyasat.checks.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}, save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const LABEL={verified:'✓ Looks good',correction:'✎ Fix details',uncertain:'? Double-check',not_found:"✕ Can't find it",retracted:'⚠ Retracted',error:"! Couldn't check"};
const EXPLAIN={verified:'This source is real and the details you wrote match the official record.',correction:'This source is real, but some details are wrong. Use the corrected version below.',uncertain:"We found a similar record but couldn't confirm the original publication. Check it yourself before citing.",not_found:"We searched Crossref and OpenAlex and found no paper that matches. It may have been made up by AI. Don't cite it unless you can find the real source.",retracted:"This paper was officially withdrawn by its journal. Don't use it as evidence in your work.",error:"We couldn't reach the databases for this one. Check your internet connection and try again."};
const SAMPLE=`Navarro, R. T., & Kim, S. (2020). Psychological distress and depressive symptoms during COVID-19 lockdowns: A longitudinal study of twelve countries. International Journal of Pandemic Mental Health, 8(2), 145–162.
LeCun, Y., Bengio, Y., & Hinton, G. (2015). Deep learning. Nature, 521(7553), 436–444.
Smith, J., & Bengio, Y. (2012). Deep learning. Nature, 521(7553), 436–444.
10.1038/s41586-020-2649-2
Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones, L., Gomez, A. N., Kaiser, L., & Polosukhin, I. (2017). Attention is all you need. Advances in Neural Information Processing Systems, 30.
Wakefield, A. J., Murch, S. H., Anthony, A., et al. (1998). Ileal-lymphoid-nodular hyperplasia, non-specific colitis, and pervasive developmental disorder in children. The Lancet, 351(9103), 637–641.`;
const counts=rs=>{const c={verified:0,correction:0,uncertain:0,not_found:0,retracted:0,error:0};rs.forEach(r=>c[r.verdict]=(c[r.verdict]||0)+1);return c;};
const fmtDate=s=>new Date(s).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const tip=t=>`<button class="tip" type="button" aria-label="${esc(t)}">?<span aria-hidden="true">${esc(t)}</span></button>`;
const slim=r=>({raw:r.raw,verdict:r.verdict,confidence:r.confidence,note:r.note,diffs:r.diffs,apa:r.apa,match:r.match&&{doi:r.match.doi,title:r.match.title,source:r.match.source}});
let STATE={type:'refs',filter:'all',running:false,forms:{}};

/* ---------- Dashboard ---------- */
function dashboard(){
  const cs=load(); const all=cs.flatMap(c=>c.results); const k=counts(all);
  const avg=cs.length?Math.round(cs.reduce((s,c)=>s+c.score,0)/cs.length):0;
  if(!cs.length){ return `<h1 class="page-h">Welcome to Siyasat</h1><p class="lead">A friendly checker for the sources in your paper.</p>${UP.zone()}
  <section class="card welcome"><h2>Is every source in your paper real?</h2><p>AI tools sometimes make up references or get the details wrong. Siyasat checks each one against real scholarly databases in seconds, for free.</p>
  <ol class="how"><li><b>Paste your references</b>Copy your reference list from your paper. Any citation style works.</li><li><b>Let Siyasat check them</b>Each one is looked up in Crossref and OpenAlex, including retraction notices.</li><li><b>Fix and copy</b>See what's wrong, then copy a corrected APA 7 list.</li></ol>
  <a class="btn primary" href="#/new">Start your first check →</a></section>
  <section class="card"><h2>Your dashboard</h2><div class="empty"><span class="big" aria-hidden="true">📋</span>No checks yet. Your numbers and recent checks will show up here after your first check.<br>They're saved only in this browser.</div></section>`;}
  return `<div class="rowh"><div><h1 class="page-h">Dashboard</h1><p class="lead">Your checks on this device.</p></div><a class="btn primary" href="#/new">+ New check</a></div>${UP.zone(true)}
  <div class="stats" role="list">
   <div class="stat" role="listitem"><b>${cs.length}</b><span>Checks run ${tip('How many times you have run a check on this device.')}</span></div>
   <div class="stat" role="listitem"><b>${k.verified+k.correction}</b><span>Sources confirmed real ${tip('References found in the databases (including ones that only needed small fixes).')}</span></div>
   <div class="stat" role="listitem"><b>${k.not_found}</b><span>Possibly fake ${tip("References we couldn't find anywhere. These may have been made up by AI.")}</span></div>
   <div class="stat" role="listitem"><b>${k.retracted}</b><span>Retracted ${tip('Papers that were officially withdrawn by their journal.')}</span></div>
   <div class="stat hl" role="listitem"><b>${avg}/100</b><span>Average integrity score ${tip('100 means every reference was found with correct details. Lower means more problems.')}</span></div>
  </div>
  <section class="card"><h2>Start a new check</h2><p class="help">Pick what you want to verify.</p>${typeCards(true)}</section>
  <section class="card"><div class="rowh"><h2>Recent checks</h2><button class="link danger" id="clearAll">Clear all data</button></div>${recentList(cs.slice(0,8))}</section>`;
}
function recentList(cs){ if(!cs.length) return '<div class="empty">No checks yet.</div>';
  return `<ul class="recent">${cs.map(c=>{const k=counts(c.results);return `<li><div class="t"><b>${esc(c.name)}</b><small>${fmtDate(c.date)} · ${c.type==='draft'?`Draft check · ${c.claims.length} claims · ${c.sources.length} sources`:(c.total||c.results.length).toLocaleString()+' references'+(c.type==='corpus'?' · corpus':'')}</small></div>
   <div class="mini">${['verified','correction','uncertain','not_found','retracted'].filter(v=>k[v]).map(v=>`<span class="badge ${v}" title="${esc(LABEL[v])}">${LABEL[v].split(' ')[0]} ${k[v]}</span>`).join('')}</div>
   ${c.total&&c.results.length<c.total&&c.status!=='done'?`<span class="status-chip">${STATE.job&&STATE.job.id===c.id?'Checking':'Paused'} · ${c.results.length} of ${c.total}</span>${STATE.job&&STATE.job.id===c.id?'':`<button class="ghost" data-resume="${c.id}">▶ Resume</button>`}`:''}${c.type==='draft'?`<span class="pill ${draftSummary(c).cls}">${esc(draftSummary(c).t)}</span>`:''}<span class="score-chip" title="Integrity score">${c.score}/100</span>
   <a class="btn ghost" href="#/results/${c.id}">Open<span class="sr"> ${esc(c.name)}</span></a>
   <button class="link danger" data-del="${c.id}">Delete<span class="sr"> ${esc(c.name)}</span></button></li>`}).join('')}</ul>`;}
function typeCards(asLinks){
  const T=[['refs','📚','Reference list','Check that each source in your bibliography is real, correct and not retracted.',true],
           ['corpus','🗂️','Review corpus','Upload a library export (.ris, .bib or .csv) and check every record before screening.',true],
           ['draft','✍️','Draft check','See what each cited source actually says next to the sentence you cited it for.',true]];
  return `<div class="types" ${asLinks?'':'role="radiogroup" aria-label="Type of check"'}>${T.map(([id,ic,t,d,on])=>asLinks
    ?(on?`<a class="type" href="#/new/${id}"><span class="tag on">Ready</span><b><span aria-hidden="true">${ic}</span> ${t}</b><small>${d}</small></a>`:`<button class="type" disabled aria-disabled="true"><span class="tag">Coming soon</span><b><span aria-hidden="true">${ic}</span> ${t}</b><small>${d}</small></button>`)
    :`<button class="type" role="radio" data-type="${id}" aria-checked="${STATE.type===id}" ${on?'':'disabled aria-disabled="true"'}><span class="tag ${on?'on':''}">${on?'Ready':'Coming soon'}</span><b><span aria-hidden="true">${ic}</span> ${t}</b><small>${d}</small></button>`).join('')}</div>`;}

/* ---------- New check ---------- */
function newCheck(){
  const refs=STATE.type==='refs';
  if(STATE.type==='draft') return draftForm();
  return `<h1 class="page-h">New check</h1><p class="lead">Three quick steps. Results arrive in seconds.</p>${UP.zone(true)}<p class="or">— or choose step by step —</p>
  <ol class="steps" aria-label="Progress"><li id="s1" class="done">Choose type</li><li id="s2" class="on">Add sources</li><li id="s3">Verify</li></ol>
  <section class="card"><h2>Step 1 · What are you checking?</h2>${typeCards(false)}</section>
  <section class="card"><h2>Step 2 · ${refs?'Paste your references':'Upload your library export'}</h2>
   <label class="big" for="name">Name this check <span class="meta">(optional)</span></label><input type="text" id="name" placeholder="e.g. Thesis chapter 2 references">
   ${refs?`<p class="help" style="margin-top:12px">Any citation style works (APA, MLA, Chicago…). Put each reference on its own line. A DOI by itself (like 10.1038/nature14539) works too.</p>
   <label class="big" for="input">Your reference list</label><textarea id="input" placeholder="Example:&#10;LeCun, Y., Bengio, Y., &amp; Hinton, G. (2015). Deep learning. Nature, 521(7553), 436–444."></textarea>`
   :`<p class="help" style="margin-top:12px">Export your search results or library from Zotero, Mendeley, EndNote, Scopus or Google Scholar as <b>.ris</b>, <b>.bib</b> (BibTeX) or <b>.csv</b>. Each record is checked like a reference.</p>
   <input type="file" id="file" class="sr" tabindex="-1" aria-hidden="true" accept=".ris,.bib,.bibtex,.csv,.txt,.nbib,.enw">
   <div class="drop" id="drop" role="button" tabindex="0" aria-describedby="dropHelp" aria-label="Choose a file, or drag and drop it here">
    <span class="dicon" aria-hidden="true">📂</span><b>Drag your file here</b> or <span class="fakebtn">Choose a file</span><small id="dropHelp">.ris, .bib (BibTeX) or .csv · any size</small></div>
   <div class="chip" id="chip" hidden><span class="ficon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 2h8l6 6v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#fff" stroke="#771712" stroke-width="1.6"/><path d="M14 2v6h6" fill="#FDF4D9" stroke="#771712" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 13h8M8 16.5h8M8 9.5h3" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round"/></svg></span><div class="chipt"><b id="chipName"></b><small><span class="ready">✓ Ready</span> <span id="chipCount"></span></small></div>
    <button class="ghost" id="changeFile" type="button">Change file</button><button class="link quiet" id="removeFile" type="button">✕ Remove file</button></div>
   <label class="big" for="input" style="margin-top:12px">Records found in your file <span class="meta">(you can edit them)</span></label><textarea id="input" placeholder="Records from your file will appear here."></textarea>`}
   <div class="actions"><button class="primary" id="run">Check my references</button>${refs?'<button class="ghost" id="sample">Try an example</button>':''}<button class="link" id="clear">${refs?'Clear':'Clear records'}</button><button class="link" id="startOver">↺ Start over</button><span class="count" id="count" aria-live="polite">0 references detected</span></div>
   <div id="msg" role="alert"></div>
   ${progressHTML()}
  </section>`;}
function draftForm(){
  return `<h1 class="page-h">New check</h1><p class="lead">Choose what you're verifying, paste it, and run.</p>

  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Siyasat verification report · ${esc(c.name)}</title>${css}</head><body><div class="mhead" style="display:flex"><div class="mark">S</div><b>Siyasat verification report</b></div><main style="margin:0 auto">
  <h1 class="page-h">${esc(c.name)}</h1><p class="lead">Checked ${esc(new Date(c.date).toString())} · ${c.type==='draft'?`Draft check · ${c.claims.length} claims · ${c.sources.length} sources`:c.results.length+' references'} · Integrity score <b>${c.score}/100</b><br>Sources queried: Crossref REST API (incl. Retraction Watch data) and OpenAlex. To save as PDF: File → Print → Save as PDF.</p>
  <section class="card"><h2>Each reference</h2>${c.results.map((r,i)=>itemHTML(r,r.i!=null?r.i:i)).join('')}</section><section class="card"><h2>Corrected bibliography (APA 7)</h2>${bib(c)}</section></main></body></html>`;}
function json(c){if(c.type==='draft')return JSON.stringify({tool:'Siyasat',type:'draft',name:c.name,checked_at:c.date,claims:c.claims.map(cl=>({sentence:cl.sentence,citations:cl.cites.map(x=>x.label),author_verdict:cl.judgment?JV[cl.judgment].t:null,author_verdict_note:'chosen by the author, not by Siyasat',sources:cl.cites.map(x=>{const i=c.sources.findIndex(s=>s.key===x.key);const r=c.results[i]||{};return {citation:x.label,reference:c.sources[i].ref,verdict:r.verdict,doi:r.match&&r.match.doi,abstract:c.sources[i].abstract&&c.sources[i].abstract.text,abstract_from:c.sources[i].abstract&&c.sources[i].abstract.from};})})),cited_not_listed:c.orphans,listed_not_cited:c.uncited},null,2);
  return JSON.stringify({tool:'Siyasat',name:c.name,checked_at:c.date,integrity:c.score,results:c.results.map(r=>({input:r.raw,verdict:r.verdict,confidence:r.confidence,doi:r.match&&r.match.doi,matched_title:r.match&&r.match.title,differences:r.diffs,note:r.note,apa:r.apa}))},null,2);}

/* ---------- Router ---------- */
/* ---------- Back + breadcrumb (in-app history) ---------- */
const HK='siyasat.hist';
let HIST=(()=>{try{return JSON.parse(sessionStorage.getItem(HK))||[]}catch(e){return[]}})();
const norm=h=>{h=(h||'').replace(/^#\/?/,'');return '#/'+(h||'dashboard');};
function track(){const h=norm(location.hash);if(HIST[HIST.length-1]===h){}else if(HIST[HIST.length-2]===h)HIST.pop();else HIST.push(h);HIST=HIST.slice(-50);try{sessionStorage.setItem(HK,JSON.stringify(HIST))}catch(e){}}
const TNAME={refs:'Reference list',corpus:'Review corpus',draft:'Draft check'};
function pageName(h,from){const [r,a]=h.replace('#/','').split('/');
  if(r==='new')return a?(from&&from.startsWith('#/new')?'step 2':'New check'):(from&&from.startsWith('#/new/')?'step 1':'New check');
  return {results:'Results',reports:'Reports',dashboard:'Dashboard',read:'Reader',upload:'Upload'}[r]||'Dashboard';}
function parentOf(h){const [r,a]=h.replace('#/','').split('/');return r==='new'&&a?'#/new':r==='read'?'#/results':'#/dashboard';}
function backTarget(){const cur=norm(location.hash);const prev=HIST.length>1?HIST[HIST.length-2]:null;
  if(prev==='#/upload'&&cur!=='#/upload')return{h:'#/dashboard',hist:false,label:'Dashboard'};
  return prev?{h:prev,hist:true,label:pageName(prev,cur)}:{h:parentOf(cur),hist:false,label:pageName(parentOf(cur),cur)};}
function goBack(){const b=backTarget();if(b.hist)history.back();else location.hash=b.h;}
function crumbs(page,arg){const L=[['Dashboard','#/dashboard']];
  if(page==='new'){L.push(['New check','#/new']);if(arg)L.push(['Step 2 · '+TNAME[arg],null]);else L[1][1]=null;}
  else if(page==='results'){const [cid,sub]=(arg||'').split('/');const c=cid?load().find(x=>x.id===cid):load()[0];L.push(['Results',c?'#/results':null]);if(c){if(sub==='refs'){L.push([c.combo?'Upload & check results':'Check','#/results/'+c.id]);L.push(['Reference results',null]);}else L.push([c.combo?'Upload & check results':(TNAME[c.type]||'Check'),null]);}}
  else if(page==='reports')L.push(['Reports',null]);
  else if(page==='upload')L.push(['Upload & check',null]);
  else if(page==='read'){L.push(['Results','#/results']);L.push(['Full-text reader',null]);}
  return `<nav class="crumbs" aria-label="Breadcrumb"><ol>${L.map(([n,h])=>`<li>${h?`<a href="${h}">${esc(n)}</a>`:`<span aria-current="page">${esc(n)}</span>`}</li>`).join('')}</ol></nav>`;}
function backbar(page,arg){if(page==='dashboard')return '';const b=backTarget();
  return `<div class="backbar"><button type="button" class="back" data-back>← Back to ${esc(b.label)}</button>${crumbs(page,arg)}</div>`;}
function saveForm(){const ty=STATE.formType;if(!ty||!$('input'))return;STATE.forms[ty]={name:$('name')?$('name').value:'',input:$('input').value,refsIn:$('refsIn')?$('refsIn').value:''};}
function restoreForm(){const f=STATE.forms[STATE.type];if(!f||!$('input'))return;if($('name'))$('name').value=f.name;$('input').value=f.input;if($('refsIn')&&f.refsIn){$('refsIn').value=f.refsIn;$('refsIn').closest('details').open=true;}
  $('input').dispatchEvent(new Event('input'));
  if(STATE.type==='corpus'&&STATE.corpus&&STATE.corpus.sizeLabel&&$('chip')){$('chipName').textContent=STATE.corpus.file;$('chipCount').textContent=STATE.corpus.sizeLabel;$('chip').hidden=false;$('drop').hidden=true;}}
function route(){
  saveForm(); STATE.formType=null; track();
  const [r,...ra]=location.hash.replace(/^#\/?/,'').split('/'); const arg=ra.join('/'); const page=r||'dashboard';
  if(page==='new'&&arg&&['refs','corpus','draft'].includes(arg))STATE.type=arg;
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.r===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  M.innerHTML=backbar(page,arg)+(page==='new'||page==='read'?'':'<div class="undobar" role="toolbar" aria-label="Undo and redo"></div>')+(page==='new'?newCheck():page==='results'?results(arg):page==='reports'?reports():page==='read'?'<div id="reader" class="reader"></div>':page==='upload'?UP.page():dashboard());
  if(page==='upload')UP.bindPage(); else UP.bind();
  if(page==='read')READER.show($('reader'),decodeURIComponent(arg||''));
  const mb=$('mback'); if(mb){const b=backTarget();mb.hidden=page==='dashboard';mb.textContent='← Back to '+b.label;}
  M.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
  document.title=({new:'New check',results:'Results',reports:'Reports',read:'Full-text reader'}[page]||'Dashboard')+' · Siyasat';
  if(page!=='new'&&STATE.editing&&!STATE.running){STATE.editing=null;STATE.forms.draft=null;}
  if(page==='new'){bindNew();STATE.formType=STATE.type;restoreForm();if(STATE.type==='draft'&&STATE.edInit)STATE.edInit();} bindCommon(arg); UNDO.paint(); window.scrollTo(0,0);
  if(route.started){const h=M.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}} route.started=true;
}
function bindCommon(arg){
  const byId0=id=>load().find(c=>c.id===id);const byId=id=>{const [a,sub]=(id||'').split('/');const c=byId0(a);return c&&sub==='refs'&&c.refResults?{...c,type:'refs',results:c.refResults}:c;};
  M.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.rep);dl(fname(c,'html'),report(c),'text/html');});
  M.querySelectorAll('[data-json]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.json);dl(fname(c,'json'),json(c),'application/json');});
  M.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.del);if(STATE.job&&STATE.job.active&&STATE.job.id===c.id){alert('This check is still running. Pause it first.');return;}if(confirm(`Delete "${c.name}"? You can undo this right after.`)){const cs=load();const at=cs.findIndex(x=>x.id===c.id);UNDO.push('history',{k:'del',items:[{c,at}],label:`deleted "${c.name}"`});save(cs.filter(x=>x.id!==c.id));if(location.hash.startsWith('#/results'))location.hash='#/dashboard';else route();toast(`Deleted "${c.name}"`);}});
  if($('clearAll'))$('clearAll').onclick=()=>{if(confirm('Delete all your saved checks from this browser? You can undo this right after.')){const cs=load();UNDO.push('history',{k:'del',items:cs.map((c,at)=>({c,at})),label:`deleted all ${cs.length} saved checks`});localStorage.removeItem(KEY);route();toast('Deleted all saved checks');}};
  if($('drows')) bindRows(arg||load()[0].id);
  M.querySelectorAll('[data-goclaims],a[href="#claims"]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=$('dstats');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});});
  M.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{STATE.page=+b.dataset.pg;const c=byId(arg||load()[0].id);$('list').innerHTML=itemList(c);bindCommon(arg);$('list').scrollIntoView({block:'start'});const f=$('list').querySelector('article');if(f){f.tabIndex=-1;f.focus({preventScroll:true});}});
  M.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editDraft(b.dataset.edit));
  if(STATE.toastNext){const t=STATE.toastNext;STATE.toastNext=null;setTimeout(()=>toast(t),50);}
  M.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>resumeJob(b.dataset.resume));
  M.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{updateCheck(b.dataset.finish,x=>{x.status='done';x.stoppedEarly=true;});route();});
  if(STATE.job&&STATE.job.active&&$('progress')) $('progress').hidden=false;
  if($('pick'))$('pick').onchange=e=>location.hash='#/results/'+e.target.value;
  M.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{STATE.filter=b.dataset.f;STATE.page=0;const id=arg||load()[0].id;$('list').innerHTML=itemList(byId(id));M.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  if($('copy'))$('copy').onclick=async()=>{const t=[...$('apa').querySelectorAll('p')].map(p=>p.innerText).join('\n');if(!t)return;
    try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    $('copied').textContent='✓ Copied! Paste it into your document.';setTimeout(()=>$('copied').textContent='',4000);};
}
(()=>{const cs=load();let ch=false;cs.forEach(c=>{if(c.status==='running'){c.status='paused';ch=true;}});if(ch)try{save(cs)}catch(e){}})();
document.body.insertAdjacentHTML('beforeend','<div class="scrim" id="scrim" hidden></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden></aside><div class="sr" id="live" aria-live="polite"></div>');
$('scrim').onclick=closeDrawer;$('mback').onclick=goBack;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Tab'&&!$('drawer').hidden){const f=[...$('drawer').querySelectorAll('button,a,[tabindex="0"]')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
window.addEventListener('hashchange',()=>{closeDrawer();route();}); route();
</script></body></html>

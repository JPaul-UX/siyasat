<style>
:root{--maroon:#771712;--maroon-dark:#5A110D;--maroon-soft:#F6E9E7;--gold:#F5C544;--gold-dark:#B8860B;--gold-soft:#FDF4D9;
 --paper:#FBF8F3;--surface:#FFF;--ink:#2A1C1A;--ink-soft:#5B4A47;--line:#E8DED6;
 --ok:#1E6B3A;--ok-bg:#E5F2E9;--warn:#7A4A00;--warn-bg:#FCEFCF;--bad:#A3201B;--bad-bg:#FBE5E3;--ret:#6B2A6E;--ret-bg:#F3E6F3;--unc:#44505E;--unc-bg:#E9EDF1;
 --shadow:0 1px 3px rgba(42,28,26,.08),0 10px 30px rgba(42,28,26,.06);--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--maroon);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 5px var(--maroon);border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;z-index:99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav.side{background:var(--maroon);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;border-right:5px solid var(--gold);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}.mark{width:40px;height:40px;border-radius:11px;background:var(--gold);color:var(--maroon);display:grid;place-items:center;font-weight:850;font-size:21px;flex:none}
.brand b{font-size:19px;display:block}.brand small{color:#F8E7C2;font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:600;margin-bottom:4px}
.nav a:hover{background:rgba(255,255,255,.1)}.nav a[aria-current=page]{background:var(--gold);color:var(--maroon)}
.nav svg{width:22px;height:22px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:#F8E7C2;padding:8px}
main{padding:28px 32px 60px;max-width:1080px;width:100%}
h1[tabindex="-1"]:focus{outline:none;box-shadow:none}
.page-h{margin:0 0 4px;font-size:26px;color:var(--maroon)}.lead{color:var(--ink-soft);margin:0 0 22px;font-size:16.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:19px;color:var(--maroon)}.help{color:var(--ink-soft);font-size:14.5px;margin:0 0 12px}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:2px solid transparent;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--maroon);color:#fff;font-weight:750;font-size:17px;padding:12px 26px;box-shadow:0 3px 0 var(--maroon-dark)}.primary:hover{background:var(--maroon-dark)}.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:var(--surface);color:var(--maroon);border-color:var(--maroon);font-weight:650;padding:8px 16px}.ghost:hover{background:var(--maroon-soft)}
.link{background:none;color:var(--ink-soft);text-decoration:underline;padding:8px}.danger{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.count{color:var(--ink-soft);font-size:14px;margin-left:auto}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:30px;line-height:1.1;color:var(--maroon)}.stat span{font-size:13.5px;color:var(--ink-soft)}
.stat.hl{background:var(--maroon);border-color:var(--maroon)}.stat.hl b{color:var(--gold)}.stat.hl span{color:#F8E7C2}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.type{text-decoration:none;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;display:block;width:100%;color:var(--ink)}
.type:hover:not(:disabled){border-color:var(--maroon)}.type[aria-checked=true]{border-color:var(--maroon);background:var(--maroon-soft)}
.type:disabled{opacity:.65;cursor:not-allowed}.type b{display:block;font-size:16.5px;color:var(--maroon);margin:6px 0 2px}.type small{color:var(--ink-soft);font-size:13.5px;display:block}
.tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--warn)}
.tag.on{background:var(--ok-bg);color:var(--ok)}
.recent{list-style:none;margin:0;padding:0}.recent li{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 2px;flex-wrap:wrap}
.recent li:first-child{border-top:0}.recent .t{flex:1;min-width:180px}.recent .t b{display:block}.recent .t small{color:var(--ink-soft)}
.mini{display:flex;gap:4px;flex-wrap:wrap}.score-chip{font-weight:800;color:var(--maroon);background:var(--gold-soft);border-radius:8px;padding:4px 10px}
.welcome{background:linear-gradient(135deg,var(--maroon),#8E2019);color:#fff;border:0}.welcome h2{color:var(--gold);font-size:22px}.welcome p{color:#FBEBDD}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;padding:0;list-style:none;counter-reset:h}
.how li{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;font-size:14.5px}.how li::before{counter-increment:h;content:counter(h);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--maroon);font-weight:850;margin-bottom:6px}
.how b{display:block;color:#fff}
.welcome .primary{background:var(--gold);color:var(--maroon);box-shadow:0 3px 0 #C99A20}.welcome .primary:hover{background:#FFD45E}
/* steps */
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 18px;counter-reset:s}
.steps li{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;color:var(--ink-soft)}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--maroon-soft);color:var(--maroon);font-weight:800;flex:none}
.steps li.on{border-color:var(--maroon);color:var(--maroon)}.steps li.on::before{background:var(--maroon);color:#fff}.steps li.done::before{content:"✓";background:var(--gold);color:var(--maroon)}
label.big{display:block;font-weight:700;margin:4px 0 6px}
input[type=text]{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#FFFDF9}
textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:10px;padding:14px;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#FFFDF9;color:var(--ink);resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--maroon);outline:none;box-shadow:0 0 0 3px var(--gold)}
.drop{border:2px dashed var(--gold-dark);border-radius:12px;padding:20px;text-align:center;background:var(--gold-soft);color:var(--warn)}
.msg{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.info{background:var(--gold-soft);color:var(--warn)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.progress{margin-top:14px}.ptrack{height:12px;background:var(--maroon-soft);border-radius:99px;overflow:hidden}.ptrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#E9A92C);transition:width .3s}
.ptext{font-size:14px;color:var(--ink-soft);margin-top:6px}
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0;list-style:none}.pipe li{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--maroon-soft);color:var(--ink-soft)}.pipe li.on{background:var(--gold);color:var(--maroon);font-weight:700}.pipe li.done{background:var(--ok-bg);color:var(--ok)}
/* results */
.summary{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.tile b{display:block;font-size:28px;line-height:1.1;margin-top:4px}
.tile.score{background:var(--maroon);color:#fff;border-color:var(--maroon)}.tile.score small{color:#F8E7C2}
.sbar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:8px;overflow:hidden}.sbar i{display:block;height:100%;background:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13.5px;font-weight:750;white-space:nowrap}
.verified{color:var(--ok);background:var(--ok-bg)}.correction{color:var(--warn);background:var(--warn-bg)}.not_found,.error{color:var(--bad);background:var(--bad-bg)}.retracted{color:var(--ret);background:var(--ret-bg)}.uncertain{color:var(--unc);background:var(--unc-bg)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0 4px;padding:0;list-style:none}.legend li{font-size:13.5px;color:var(--ink-soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}.filters button{min-height:36px;padding:4px 12px;background:#fff;border:1px solid var(--line);font-size:14px}.filters button[aria-pressed=true]{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.item{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.item.v-verified{border-left-color:var(--ok)}.item.v-correction{border-left-color:#D99A1E}.item.v-not_found,.item.v-error{border-left-color:var(--bad)}.item.v-retracted{border-left-color:var(--ret)}.item.v-uncertain{border-left-color:var(--unc)}
.item .what{margin:8px 0 6px;font-size:15px}.cite{font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--ink-soft);background:#FFFDF9;border-radius:8px;padding:8px 10px;margin:6px 0;word-break:break-word}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}th,td{text-align:left;padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--ink-soft);font-weight:650;background:#FFFBF2}
td.fix{font-weight:700;color:var(--ok)}.note{font-size:13px;color:var(--warn);font-weight:500}.meta{font-size:13px;color:var(--ink-soft)}
.apa{background:#FFFDF9;border:1px dashed var(--gold-dark);border-radius:10px;padding:12px 16px}.apa p{padding-left:2em;text-indent:-2em;margin:8px 0}
.empty{text-align:center;color:var(--ink-soft);padding:22px}.empty .big{font-size:38px;display:block}
.tip{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--maroon-soft);color:var(--maroon);font-size:12px;font-weight:800;border:0;min-height:0;padding:0;cursor:help;vertical-align:middle}
.tip span{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:230px;background:var(--ink);color:#fff;font-weight:500;font-size:13px;padding:8px 10px;border-radius:8px;z-index:5;text-align:left;line-height:1.4}
.tip:hover span,.tip:focus span{display:block}
.rowh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}

.claim{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.claim-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#FFFBF2;border-bottom:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr}.pair>div{padding:14px}.pair>div+div{border-left:1px solid var(--line);background:#FFFDF9}
.pair h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft)}
.pair .txt{font-size:15px;line-height:1.6}.abs{max-height:260px;overflow:auto;font-size:14px!important}
mark{background:var(--gold-soft);color:var(--ink);border-bottom:2px solid var(--gold);padding:0 1px;border-radius:2px}mark.num{background:var(--gold);color:var(--maroon);font-weight:800;border-bottom-color:var(--maroon)}
.warnnum{margin-top:8px;font-size:13.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px}
.judge{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.judge button{min-height:40px;padding:4px 14px;background:#fff;border:2px solid var(--line);font-weight:650;font-size:14px}
.judge button[aria-pressed=true][data-j=match]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.judge button[aria-pressed=true][data-j=nomatch]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.judge button[aria-pressed=true][data-j=unsure]{background:var(--unc-bg);border-color:var(--unc);color:var(--unc)}
.revbar{height:10px;background:var(--maroon-soft);border-radius:99px;overflow:hidden;margin-top:6px}.revbar i{display:block;height:100%;background:var(--gold)}
.oneline{background:var(--gold-soft);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-weight:650;color:var(--maroon);margin-bottom:16px}
@media(max-width:860px){.pair{grid-template-columns:1fr}.pair>div+div{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:50;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:4px solid var(--gold);flex-direction:row}
 .brand,.side .foot{display:none}.nav{display:flex;width:100%}.nav a{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:7px 2px;margin:0;text-align:center}
 .mhead{display:flex!important}main{padding:16px 16px 100px}
 .stats{grid-template-columns:repeat(2,1fr)}.stats .stat.hl{grid-column:1/-1}.types,.how{grid-template-columns:1fr}
 .summary{grid-template-columns:repeat(2,1fr)}.tile.score{grid-column:1/-1}.steps li{font-size:12.5px;padding:8px;flex-direction:column;text-align:center;gap:4px}.primary{width:100%}.count{margin-left:0}.card{padding:16px}
}
.mhead{display:none;align-items:center;gap:10px;background:var(--maroon);color:#fff;padding:12px 16px;border-bottom:4px solid var(--gold)}.mhead .mark{width:34px;height:34px;font-size:18px}
@media print{nav.side,.mhead,.actions,.filters{display:none}.app{display:block}.card{box-shadow:none}}
</style></head><body>

<script>
const $=id=>document.getElementById(id), M=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='siyasat.checks.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}, save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const LABEL={verified:'✓ Looks good',correction:'✎ Fix details',uncertain:'? Double-check',not_found:"✕ Can't find it",retracted:'⚠ Retracted',error:"! Couldn't check"};
const EXPLAIN={verified:'This source is real and the details you wrote match the official record.',correction:'This source is real, but some details are wrong. Use the corrected version below.',uncertain:"We found a similar record but couldn't confirm the original publication. Check it yourself before citing.",not_found:"We searched Crossref and OpenAlex and found no paper that matches. It may have been made up by AI. Don't cite it unless you can find the real source.",retracted:"This paper was officially withdrawn by its journal. Don't use it as evidence in your work.",error:"We couldn't reach the databases for this one. Check your internet connection and try again."};
const SAMPLE=`Navarro, R. T., & Kim, S. (2020). Psychological distress and depressive symptoms during COVID-19 lockdowns: A longitudinal study of twelve countries. International Journal of Pandemic Mental Health, 8(2), 145–162.
LeCun, Y., Bengio, Y., & Hinton, G. (2015). Deep learning. Nature, 521(7553), 436–444.
Smith, J., & Bengio, Y. (2012). Deep learning. Nature, 521(7553), 436–444.
10.1038/s41586-020-2649-2
Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones, L., Gomez, A. N., Kaiser, L., & Polosukhin, I. (2017). Attention is all you need. Advances in Neural Information Processing Systems, 30.
Wakefield, A. J., Murch, S. H., Anthony, A., et al. (1998). Ileal-lymphoid-nodular hyperplasia, non-specific colitis, and pervasive developmental disorder in children. The Lancet, 351(9103), 637–641.`;
const counts=rs=>{const c={verified:0,correction:0,uncertain:0,not_found:0,retracted:0,error:0};rs.forEach(r=>c[r.verdict]=(c[r.verdict]||0)+1);return c;};
const fmtDate=s=>new Date(s).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const tip=t=>`<button class="tip" type="button" aria-label="${esc(t)}">?<span aria-hidden="true">${esc(t)}</span></button>`;
const slim=r=>({raw:r.raw,verdict:r.verdict,confidence:r.confidence,note:r.note,diffs:r.diffs,apa:r.apa,match:r.match&&{doi:r.match.doi,title:r.match.title,source:r.match.source}});
let STATE={type:'refs',filter:'all',running:false};

/* ---------- Dashboard ---------- */
function dashboard(){
  const cs=load(); const all=cs.flatMap(c=>c.results); const k=counts(all);
  const avg=cs.length?Math.round(cs.reduce((s,c)=>s+c.score,0)/cs.length):0;
  if(!cs.length){ return `<h1 class="page-h">Welcome to Siyasat</h1><p class="lead">A friendly checker for the sources in your paper.</p>
  <section class="card welcome"><h2>Is every source in your paper real?</h2><p>AI tools sometimes make up references or get the details wrong. Siyasat checks each one against real scholarly databases in seconds, for free.</p>
  <ol class="how"><li><b>Paste your references</b>Copy your reference list from your paper. Any citation style works.</li><li><b>Let Siyasat check them</b>Each one is looked up in Crossref and OpenAlex, including retraction notices.</li><li><b>Fix and copy</b>See what's wrong, then copy a corrected APA 7 list.</li></ol>
  <a class="btn primary" href="#/new">Start your first check →</a></section>
  <section class="card"><h2>Your dashboard</h2><div class="empty"><span class="big" aria-hidden="true">📋</span>No checks yet. Your numbers and recent checks will show up here after your first check.<br>They're saved only in this browser.</div></section>`;}
  return `<div class="rowh"><div><h1 class="page-h">Dashboard</h1><p class="lead">Your checks on this device.</p></div><a class="btn primary" href="#/new">+ New check</a></div>
  <div class="stats" role="list">
   <div class="stat" role="listitem"><b>${cs.length}</b><span>Checks run ${tip('How many times you have run a check on this device.')}</span></div>
   <div class="stat" role="listitem"><b>${k.verified+k.correction}</b><span>Sources confirmed real ${tip('References found in the databases (including ones that only needed small fixes).')}</span></div>
   <div class="stat" role="listitem"><b>${k.not_found}</b><span>Possibly fake ${tip("References we couldn't find anywhere. These may have been made up by AI.")}</span></div>
   <div class="stat" role="listitem"><b>${k.retracted}</b><span>Retracted ${tip('Papers that were officially withdrawn by their journal.')}</span></div>
   <div class="stat hl" role="listitem"><b>${avg}/100</b><span>Average integrity score ${tip('100 means every reference was found with correct details. Lower means more problems.')}</span></div>
  </div>
  <section class="card"><h2>Start a new check</h2><p class="help">Pick what you want to verify.</p>${typeCards(true)}</section>
  <section class="card"><div class="rowh"><h2>Recent checks</h2><button class="link danger" id="clearAll">Clear all data</button></div>${recentList(cs.slice(0,8))}</section>`;
}
function recentList(cs){ if(!cs.length) return '<div class="empty">No checks yet.</div>';

  STATE.running=false;
  if(errs===es.length){$('msg').innerHTML='<div class="msg err">We couldn\'t reach the databases. Check your internet connection and try again in a minute.</div>';$('run').disabled=false;$('run').textContent='Try again';return;}
  const c={id:Date.now().toString(36),name:($('name').value.trim()||('Reference check '+new Date().toLocaleDateString())),type:STATE.type,date:new Date().toISOString(),results,score:SIY.integrity(results)};
  const cs=load();cs.unshift(c);try{save(cs);}catch(e){} location.hash='#/results/'+c.id;
}

/* ---------- Results ---------- */
function results(id){
  const cs=load(); const c=id?cs.find(x=>x.id===id):cs[0];
  if(!c) return `<h1 class="page-h">Results</h1><section class="card"><div class="empty"><span class="big" aria-hidden="true">🔍</span>${id?"We couldn't find that check. It may have been deleted.":'No results yet. Run a check to see results here.'}<div class="actions" style="justify-content:center"><a class="btn primary" href="#/new">Start a check</a></div></div></section>`;
  if(c.type==='draft') return draftResults(c,cs);
  const k=counts(c.results);
  return `<div class="rowh"><div><h1 class="page-h">Results</h1><p class="lead">${esc(c.name)} · ${fmtDate(c.date)}</p></div>${cs.length>1?`<label class="meta">Other checks: <select id="pick">${cs.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)} (${fmtDate(x.date)})</option>`).join('')}</select></label>`:''}</div>
  <section class="card" aria-labelledby="rh"><h2 id="rh" tabindex="-1">Summary</h2>
   <div class="summary">
    <div class="tile score"><small>Integrity score ${tip('100 means every reference was found and matched exactly. Wrong details lower the score; made-up or retracted sources lower it most.')}</small><b>${c.score}/100</b><div class="sbar"><i style="width:${c.score}%"></i></div></div>
    ${['verified','correction','uncertain','not_found','retracted'].map(v=>`<div class="tile"><span class="badge ${v}">${LABEL[v]}</span><b>${k[v]}</b></div>`).join('')}
   </div>
   <ul class="legend" aria-label="What the labels mean">${['verified','correction','uncertain','not_found','retracted'].map(v=>`<li><span class="badge ${v}">${LABEL[v]}</span><br>${EXPLAIN[v]}</li>`).join('')}</ul>
  </section>
  <section class="card"><h2>Each reference</h2><div class="filters" role="group" aria-label="Show"><button aria-pressed="${STATE.filter==='all'}" data-f="all">All (${c.results.length})</button><button aria-pressed="${STATE.filter==='problems'}" data-f="problems">Only problems (${c.results.length-k.verified})</button></div><div id="list">${itemList(c)}</div></section>
  <section class="card"><h2>Corrected bibliography (APA 7)</h2><p class="help">Built from the real records, sorted A–Z. References we couldn't find or that are retracted are left out and listed below.</p>${bib(c)}
   <div class="actions"><button class="primary" id="copy">Copy bibliography</button><button class="ghost" data-rep="${c.id}">Download report</button><button class="link" data-json="${c.id}">Download data (JSON)</button><span id="copied" class="count" aria-live="polite"></span></div></section>`;}
function itemList(c){const shown=c.results.map((r,i)=>[r,i]).filter(([r])=>STATE.filter==='all'||r.verdict!=='verified');
  return shown.length?shown.map(([r,i])=>{const m=r.match;let h=`<article class="item v-${r.verdict}" aria-label="Reference ${i+1}: ${esc(LABEL[r.verdict])}"><span class="badge ${r.verdict}">${LABEL[r.verdict]}</span> <span class="meta">Reference ${i+1}${r.confidence!=null?` · match confidence ${Math.round(r.confidence*100)}%`:''}</span>
   <p class="what">${EXPLAIN[r.verdict]}</p><div class="cite"><span class="sr">You wrote: </span>${esc(r.raw)}</div>`;
   if(m)h+=`<div class="meta">Matched record: <a href="https://doi.org/${esc(m.doi)}" target="_blank" rel="noopener">${esc(m.title)}<span class="sr"> (opens in new tab)</span></a> · ${esc(m.source)} · doi:${esc(m.doi)}</div>`;
   if(r.note&&r.verdict!=='uncertain')h+=`<div class="meta" style="margin-top:4px">${esc(r.note)}</div>`;
   if(r.diffs&&r.diffs.length)h+=`<div class="tbl"><table><caption class="sr">Differences</caption><tr><th scope="col">Detail</th><th scope="col">You wrote</th><th scope="col">Official record</th></tr>${r.diffs.map(d=>`<tr><td>${d.field}</td><td>${esc(d.cited)}</td><td class="${d.suspect?'':'fix'}">${esc(d.actual)}${d.note?`<div class="note">${esc(d.note)}</div>`:''}</td></tr>`).join('')}</table></div>`;
   return h+'</article>'}).join(''):'<div class="empty"><span class="big" aria-hidden="true">🎉</span>No problems found.</div>';}
function bib(c){const seen=new Set();const ok=c.results.filter(r=>r.apa&&r.verdict!=='retracted'&&!(r.match&&r.match.doi&&seen.has(r.match.doi))&&(r.match&&seen.add(r.match.doi),true)).map(r=>r.apa).sort((a,b)=>a.replace(/<[^>]+>/g,'').localeCompare(b.replace(/<[^>]+>/g,'')));
  const bad=c.results.filter(r=>['not_found','retracted','error'].includes(r.verdict));
  return `<div class="apa" id="apa">${ok.length?ok.map(a=>`<p>${a}</p>`).join(''):'<div class="empty">No confirmed references to list.</div>'}</div>`+(bad.length?`<div class="meta" style="margin-top:10px"><b>Left out, please review:</b><ul>${bad.map(r=>`<li><span class="badge ${r.verdict}">${LABEL[r.verdict]}</span> ${esc(r.raw.slice(0,110))}${r.raw.length>110?'…':''}</li>`).join('')}</ul></div>`:'');}

/* ---------- Reports ---------- */
function reports(){const cs=load();
  return `<h1 class="page-h">Reports</h1><p class="lead">Timestamped verification reports you can show your adviser or panel. Each verdict links to its evidence.</p>
  <section class="card">${cs.length?`<ul class="recent">${cs.map(c=>{const k=counts(c.results);return `<li><div class="t"><b>Verification report · ${esc(c.name)}</b><small>${fmtDate(c.date)} · ${c.type==='draft'?`Draft check · ${c.claims.length} claims · ${c.sources.length} sources`:c.results.length+' references'} · ${k.not_found} possibly fake · ${k.retracted} retracted</small></div><span class="score-chip">${c.score}/100</span>
   <button class="ghost" data-rep="${c.id}">Download report<span class="sr"> for ${esc(c.name)}</span></button><button class="link" data-json="${c.id}">JSON</button></li>`}).join('')}</ul>
   <p class="help" style="margin-top:12px">Tip: open the downloaded report and use your browser's <b>Print → Save as PDF</b>.</p>`
   :`<div class="empty"><span class="big" aria-hidden="true">📄</span>No reports yet. Every check you run creates a report here.<div class="actions" style="justify-content:center"><a class="btn primary" href="#/new">Start a check</a></div></div>`}</section>`;}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
const fname=(c,ext)=>`siyasat-report-${c.name.replace(/[^\w-]+/g,'-').slice(0,40)}-${c.date.replace(/[:.]/g,'-')}.${ext}`;
function report(c){const css=document.querySelector('style').outerHTML;
  if(c.type==='draft') return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Siyasat draft report · ${esc(c.name)}</title>${css}</head><body><div class="mhead" style="display:flex"><div class="mark">S</div><b>Siyasat draft check report</b></div><main style="margin:0 auto">
  <h1 class="page-h">${esc(c.name)}</h1><p class="lead">Checked ${esc(new Date(c.date).toString())} · ${c.claims.length} claims · ${c.sources.length} sources · ${c.claims.filter(x=>x.judgment).length} claims reviewed by the author<br>Abstracts from OpenAlex/Crossref. Judgments below were made by the author, not by Siyasat. To save as PDF: File → Print → Save as PDF.</p>
  ${c.orphans.length?`<p><b>Cited but missing from reference list:</b> ${c.orphans.map(o=>esc(o.label)).join(', ')}</p>`:''}${c.uncited.length?`<p><b>Listed but never cited:</b> ${c.uncited.map(esc).join(' · ')}</p>`:''}
  <section class="card">${claimCards(c,false)}</section></main></body></html>`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Siyasat verification report · ${esc(c.name)}</title>${css}</head><body><div class="mhead" style="display:flex"><div class="mark">S</div><b>Siyasat verification report</b></div><main style="margin:0 auto">
  <h1 class="page-h">${esc(c.name)}</h1><p class="lead">Checked ${esc(new Date(c.date).toString())} · ${c.type==='draft'?`Draft check · ${c.claims.length} claims · ${c.sources.length} sources`:c.results.length+' references'} · Integrity score <b>${c.score}/100</b><br>Sources queried: Crossref REST API (incl. Retraction Watch data) and OpenAlex. To save as PDF: File → Print → Save as PDF.</p>
  <section class="card"><h2>Each reference</h2>${(STATE.filter='all',itemList(c))}</section><section class="card"><h2>Corrected bibliography (APA 7)</h2>${bib(c)}</section></main></body></html>`;}
function json(c){if(c.type==='draft')return JSON.stringify({tool:'Siyasat',type:'draft',name:c.name,checked_at:c.date,claims:c.claims.map(cl=>({sentence:cl.sentence,citations:cl.cites.map(x=>x.label),author_judgment:cl.judgment,sources:cl.cites.map(x=>{const i=c.sources.findIndex(s=>s.key===x.key);const r=c.results[i]||{};return {citation:x.label,reference:c.sources[i].ref,verdict:r.verdict,doi:r.match&&r.match.doi,abstract:c.sources[i].abstract&&c.sources[i].abstract.text,abstract_from:c.sources[i].abstract&&c.sources[i].abstract.from};})})),cited_not_listed:c.orphans,listed_not_cited:c.uncited},null,2);
  return JSON.stringify({tool:'Siyasat',name:c.name,checked_at:c.date,integrity:c.score,results:c.results.map(r=>({input:r.raw,verdict:r.verdict,confidence:r.confidence,doi:r.match&&r.match.doi,matched_title:r.match&&r.match.title,differences:r.diffs,note:r.note,apa:r.apa}))},null,2);}

/* ---------- Router ---------- */
function route(){
  const [r,arg]=location.hash.replace(/^#\/?/,'').split('/'); const page=r||'dashboard';
  if(page==='new'&&arg&&['refs','corpus','draft'].includes(arg))STATE.type=arg;
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.r===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  M.innerHTML=page==='new'?newCheck():page==='results'?results(arg):page==='reports'?reports():dashboard();
  document.title=({new:'New check',results:'Results',reports:'Reports'}[page]||'Dashboard')+' · Siyasat';
  if(page==='new')bindNew(); bindCommon(arg); window.scrollTo(0,0);
  if(route.started){const h=M.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}} route.started=true;
}
function bindCommon(arg){
  const byId=id=>load().find(c=>c.id===id);
  M.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.rep);dl(fname(c,'html'),report(c),'text/html');});
  M.querySelectorAll('[data-json]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.json);dl(fname(c,'json'),json(c),'application/json');});
  M.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.del);if(confirm(`Delete "${c.name}"? This can't be undone.`)){save(load().filter(x=>x.id!==c.id));route();}});
  if($('clearAll'))$('clearAll').onclick=()=>{if(confirm('Delete all your saved checks from this browser? This can\'t be undone.')){localStorage.removeItem(KEY);route();}};
  M.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const cs=load();const c=cs.find(x=>x.id===(arg||cs[0].id));const i=+b.dataset.claim;
    c.claims[i].judgment=c.claims[i].judgment===b.dataset.j?null:b.dataset.j;save(cs);
    M.querySelectorAll(`[data-claim="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.j===c.claims[i].judgment));
    const d=c.claims.filter(x=>x.judgment).length;$('revn').textContent=`${d} of ${c.claims.length}`;$('revbar').style.width=(d/c.claims.length*100)+'%';});
  if($('pick'))$('pick').onchange=e=>location.hash='#/results/'+e.target.value;
  M.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{STATE.filter=b.dataset.f;const id=arg||load()[0].id;$('list').innerHTML=itemList(byId(id));M.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  if($('copy'))$('copy').onclick=async()=>{const t=[...$('apa').querySelectorAll('p')].map(p=>p.innerText).join('\n');if(!t)return;
    try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    $('copied').textContent='✓ Copied! Paste it into your document.';setTimeout(()=>$('copied').textContent='',4000);};
}
window.addEventListener('hashchange',route); route();
</script></body></html>
